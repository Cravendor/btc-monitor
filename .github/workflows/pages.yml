name: BTC dashboard Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - bias.html
      - data/history/bitget_4h_context.jsonl
      - scripts/context_trends.py
      - scripts/context_trend_dashboard.py
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage public dashboard and read-only 4H history
        run: |
          mkdir _site
          cp index.html bias.html _site/
          python - <<'PY'
          from datetime import datetime, timezone
          from scripts.context_trend_dashboard import build
          build('data/history/bitget_4h_context.jsonl',
                '_site/btc-4h-history.html',
                datetime.now(timezone.utc).isoformat())
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
