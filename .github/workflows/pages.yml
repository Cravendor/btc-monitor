name: BTC dashboard Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - bias.html
      - btc-methoden.html
      - reports/index.json
      - data/history/bitget_4h_context.jsonl
      - scripts/context_trends.py
      - scripts/context_trend_dashboard.py
      - scripts/home_dashboard.py
      - scripts/market_scenarios.py
      - scripts/multi_timeframe_dashboard.py
      - scripts/history_coverage.py
      - scripts/signal_outcome_validation.py
      - scripts/signal_statistics.py
      - scripts/timeframe_history_dashboard.py
      - data/collector-health.json
      - data/latest.json
      - data/history/timeframe_signals.jsonl
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - BTC market snapshots
      - Archive BTC 4H provisional history
      - BTC collector health check
      - Archive BTC bias report
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # A failed watchdog may have saved a valid stale/missing report. Publish
    # that report too, always from the default branch and without run artifacts.
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
       (contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion) &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage public dashboard and read-only 4H history
        run: |
          mkdir _site
          cp index.html _site/btc-dashboard.html
          cp bias.html btc-methoden.html _site/
          python -m scripts.home_dashboard data/latest.json _site/index.html
          python - <<'PY'
          from datetime import datetime, timezone
          from scripts.context_trend_dashboard import build
          build('data/history/bitget_4h_context.jsonl',
                '_site/btc-4h-history.html',
                datetime.now(timezone.utc).isoformat())
          PY
          python -m scripts.multi_timeframe_dashboard data/latest.json _site/btc-timeframes.html data/collector-health.json
          python -m scripts.timeframe_history_dashboard data/history/timeframe_signals.jsonl _site/btc-signal-history.html data/collector-health.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

