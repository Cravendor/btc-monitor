name: BTC dashboard Pages
on:
  push:
    branches: [main]
    paths: [index.html, bias.html, .github/workflows/pages.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate collector and CVD contracts
        run: python3 -m unittest discover -s tests
      - name: Stage public dashboard
        run: |
          mkdir _site
          cp index.html bias.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
