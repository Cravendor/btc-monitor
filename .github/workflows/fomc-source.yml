name: FOMC Official Source Snapshot

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate official FOMC source
        run: |
          mkdir -p output
          python scripts/fomc_calendar_source.py > output/fomc_source_snapshot.json
          python -m json.tool output/fomc_source_snapshot.json > /dev/null
      - name: Upload source snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: fomc-source-snapshot
          path: output/fomc_source_snapshot.json
          retention-days: 30
