name: BTC multi-year daily history
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cycle_history.py
      - scripts/elliott_history.py
      - scripts/source_revision_audit.py
      - scripts/elliott_observation_runner.py
      - .github/workflows/cycle-history.yml
  workflow_run:
    workflows: [BTC market snapshots, BTC collector health check]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: btc-market-collector
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bounded history collector
        run: python -m unittest tests.test_cycle_history tests.test_elliott_history tests.test_source_revision_audit tests.test_elliott_observation_runner -v
      - name: Resume history and preserve checkpoints
        run: |
          history_status=0
          python -m scripts.cycle_history --max-pages 32 --seconds 150 || history_status=$?
          elliott_status=0
          python -m scripts.elliott_history --max-pages 12 --seconds 90 || elliott_status=$?
          revision_status=0
          python -m scripts.source_revision_audit --seconds 75 || revision_status=$?
          if [ -f data/history/bitget_btcusdt_daily.json ]; then
            git add -- data/history/bitget_btcusdt_daily.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Bitget multi-year daily history'
              git push origin HEAD:main
            fi
          fi
          if [ -d data/history/elliott ]; then
            git add -- data/history/elliott
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Checkpoint Bitget Elliott candle history'
              git push origin HEAD:main
            fi
          fi
          if [ -d data/history/source-revision-audits ]; then
            git add -- data/history/source-revision-audits
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Audit closed Bitget candle revisions without activation'
              git push origin HEAD:main
            fi
          fi
          observation_status=0
          python -m scripts.elliott_observation_runner || observation_status=$?
          if [ -d data/history/elliott-observations ]; then
            git add -- data/history/elliott-observations
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve Elliott observation manifests'
              git push origin HEAD:main
            fi
          fi
          [ "$observation_status" -eq 0 ] || exit "$observation_status"
          [ "$revision_status" -eq 0 ] || exit "$revision_status"
          [ "$elliott_status" -eq 0 ] || exit "$elliott_status"
          exit "$history_status"
      - name: Preserve public revision evidence if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-source-revision-audits
          path: output/source-revision-audit.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Preserve current Elliott manifests if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elliott-observation-manifests
          path: output/elliott-observation-current
          retention-days: 30
          if-no-files-found: ignore
