name: BTC multi-year daily history
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cycle_history.py
      - .github/workflows/cycle-history.yml
permissions: {}
concurrency:
  group: btc-market-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bounded history collector
        run: python -m unittest tests.test_cycle_history -v
      - name: Resume history and preserve checkpoints
        run: |
          history_status=0
          python -m scripts.cycle_history --max-pages 32 --seconds 150 || history_status=$?
          if [ -f data/history/bitget_btcusdt_daily.json ]; then
            git add -- data/history/bitget_btcusdt_daily.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Bitget multi-year daily history'
              git push origin HEAD:main
            fi
          fi
          exit "$history_status"
