name: BTC market snapshots
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, tests/**, .github/workflows/btc.yml]

permissions: {}
concurrency:
  group: btc-market-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Only to save public market snapshots in this repository.
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Validate collector
        run: python3 -m unittest discover -s tests
      - name: Collect public data
        id: collect
        run: python3 scripts/collect.py
      - name: Save snapshots, including API failures
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -d data ]; then
            echo 'No snapshot was produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          if ! git diff --cached --quiet; then
            git commit -m 'Save BTC market snapshot'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Flag incomplete collection after saving
        if: steps.collect.outputs.status != 'ok'
        run: |
          echo 'Collection incomplete. Inspect the saved JSON and job summary.'
          exit 1
