name: Validate CVD coverage tests

on:
  pull_request:
    paths:
      - 'scripts/cvd_coverage.py'
      - 'tests/test_cvd_coverage.py'
      - '.github/workflows/cvd-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run all standard-library unit tests
        run: python3 -m unittest discover -s tests -v
