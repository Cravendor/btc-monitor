name: BTC collector health check
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collector_health.py
      - scripts/history_coverage.py
      - .github/workflows/collector-health.yml
  workflow_run:
    workflows: [BTC market snapshots]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: btc-market-collector
  cancel-in-progress: false
jobs:
  check:
    # Use trusted current main only, never triggering code/artifacts. Only cron
    # and explicit manual checks may collect, and only after a stale/missing check.
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate health checker
        run: |
          python3 -m unittest discover -s tests -p 'test_collector_health*.py'
          python3 -m unittest discover -s tests -p 'test_history_coverage.py'
      - name: Check freshness and recover stale market snapshots
        env:
          BTC_WATCHDOG_EVENT: ${{ github.event_name }}
        run: python3 -m scripts.watchdog_recovery

