name: BTC 4H History Release Validation

on:
  push:
    branches:
      - release/btc-4h-history
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }}
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9.14'
            os: ubuntu-22.04
          - python: '3.11'
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q scripts tests
      - name: Run isolated release tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate read-only HTML from existing archive
        run: |
          mkdir -p output
          cp index.html output/btc-dashboard.html
          cp bias.html btc-methoden.html output/
          python -m scripts.monitor_archive
          python -m scripts.home_dashboard data/latest.json output/index.html
          python - <<'PY'
          from datetime import datetime, timezone
          from scripts.context_trend_dashboard import build
          build('data/history/bitget_4h_context.jsonl',
                'output/btc-4h-history.html',
                datetime.now(timezone.utc).isoformat())
          PY
          python -m scripts.timeframe_history_dashboard data/history/timeframe_signals.jsonl output/btc-signal-history.html data/collector-health.json
          python -m scripts.multi_timeframe_dashboard data/latest.json output/btc-timeframes.html data/collector-health.json
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: btc-history-release-preview
          path: output/
          retention-days: 30


