<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTC Bias History</title><style>body{background:#0d1420;color:#e3ebf5;font:16px system-ui;max-width:1000px;margin:32px auto;padding:20px}a{color:#a9caff}p,small{color:#a8b8ce}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #334;text-align:left}.strongbear{color:#ff7575}.bear{color:#ffaf91}.neutral{color:#bbc4d1}.bull{color:#8fe1c0}.strongbull{color:#42d79e}select{padding:8px;background:#182334;color:white;border:1px solid #445}</style><h1>BTC Market Bias · Historie</h1><p>Gearchiveerde beoordelingen. Geen scores berekend uit ontbrekende data. Dag-, week- en maandfilters tonen werkelijk geregistreerde rapporten, geen voorspellingen.</p><a href="./">← Marktmonitor</a><p><label>Periode <select id="days"><option value="1">24 uur</option><option value="7" selected>7 dagen</option><option value="30">30 dagen</option><option value="3650">Alles</option></select></label></p><p id="state">Rapporten laden…</p><table><thead><tr><th>Rapporttijd</th><th>Monitor</th><th>4H–1D</th><th>7D</th><th>30D/macro</th></tr></thead><tbody id="rows"></tbody></table><script>
const root='https://raw.githubusercontent.com/Cravendor/btc-monitor/main/reports/index.json';
const names={'-2':'Sterk bearish','-1':'Zwak bearish','0':'Neutraal','1':'Zwak bullish','2':'Sterk bullish'};
const classes={'-2':'strongbear','-1':'bear','0':'neutral','1':'bull','2':'strongbull'};
let reports=[];
function render(){const cutoff=Date.now()-Number(document.querySelector('#days').value)*86400000;const filtered=reports.filter(r=>Date.parse(r.reported_at)>=cutoff).sort((a,b)=>Date.parse(b.reported_at)-Date.parse(a.reported_at));document.querySelector('#state').textContent=filtered.length+' rapport(en) in deze periode; ontbrekende rapporten zijn geen neutrale scores.';const tbody=document.querySelector('#rows');tbody.replaceChildren();for(const r of filtered){const tr=document.createElement('tr');const vals=[new Date(r.reported_at).toLocaleString('nl-NL',{timeZone:'Europe/Amsterdam'}),r.monitor,...['4h_1d','7d','30d_macro'].map(k=>r.bias[k])];for(const v of vals){const td=document.createElement('td');if(v&&typeof v==='object'){td.textContent=v.score===null?'ONVOLDOENDE DATA':names[String(v.score)];td.className=classes[String(v.score)]||'neutral';td.title=v.reason||'';}else td.textContent=v;tr.append(td)}tbody.append(tr)}}
document.querySelector('#days').addEventListener('change',render);
fetch(root,{cache:'no-store'}).then(r=>{if(r.status===404)return {reports:[]};if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{reports=Array.isArray(x.reports)?x.reports:[];render()}).catch(e=>document.querySelector('#state').textContent='Archief niet bereikbaar: '+e.message);
</script></html>
